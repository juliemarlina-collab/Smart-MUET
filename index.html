<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="refresh" content="0; url=splash.html">
    <meta name="theme-color" content="#000000">
    <title>Smart MUET Guide V2</title>
    
    <!-- Fallback if redirect doesn't work -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Sora', 'DM Sans', sans-serif;
            background-color: #000000;
            color: #FFFBF0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            text-align: center;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #008080;
            font-weight: 700;
        }
        
        p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #FFFBF0;
        }
        
        a {
            display: inline-block;
            padding: 12px 20px;
            background-color: #008080;
            color: #000000;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: background-color 150ms ease-out;
            border: 2px solid #008080;
        }
        
        a:hover {
            background-color: #006666;
            border-color: #006666;
        }
        
        a:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart MUET Guide V2</h1>
        <p>Redirecting to app...</p>
        <a href="splash.html">Click here if not redirected</a>
    </div>
    
    <script>
        // Fallback redirect if meta refresh doesn't work
        window.location.href = 'splash.html';
    </script>
</body>
</html>
