<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Smart MUET Guide V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#008080;--black:#000;--cream:#FFFBF0;--heading:'Sora',sans-serif;--body:'DM Sans',sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--body);background:var(--black);color:var(--cream);overflow:hidden}
    .splash-container{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:16px}
    .splash-logo{width:100%;max-width:280px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;opacity:0;animation:fadeIn .4s ease-out forwards}
    .splash-logo svg{width:100%;height:100%}
    .logo-circle{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .logo-accent{fill:var(--primary)}
    .splash-logo.pulse{animation:fadeIn .4s ease-out forwards,pulse 1.6s ease-in-out forwards;animation-delay:0s,1.2s}
    .splash-content{text-align:center;opacity:0;animation:fadeIn .2s ease-out .4s forwards}
    .splash-headline{font-family:var(--heading);font-size:48px;font-weight:700;line-height:1.3;color:var(--primary);margin-bottom:8px}
    .splash-tagline{font-size:18px;color:var(--cream);opacity:.9}
    .splash-progress{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;gap:8px;opacity:.6}
    .progress-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);opacity:.3}
    .progress-dot.active{opacity:1}
    .splash-skip{position:absolute;top:16px;right:16px;padding:8px 12px;background:transparent;border:2px solid var(--primary);color:var(--primary);font:600 14px var(--body);cursor:pointer;border-radius:4px}
    .splash-container.exit{animation:fadeOut .3s ease-in forwards}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes fadeOut{from{opacity:1}to{opacity:0}}
    @media(max-width:768px){.splash-headline{font-size:32px}.splash-tagline{font-size:16px}.splash-logo{max-width:200px}}
    @media(max-width:480px){.splash-headline{font-size:28px}.splash-tagline{font-size:14px}.splash-logo{max-width:160px}}
  </style>
</head>
<body>
  <div class="splash-container" id="splashContainer">
    <div class="splash-logo" id="splashLogo">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle class="logo-circle" cx="100" cy="100" r="90"/>
        <circle class="logo-accent" cx="100" cy="70" r="12"/>
        <path class="logo-circle" d="M 60 50 L 50 50 L 50 150 L 60 150"/>
        <path class="logo-circle" d="M 140 50 L 150 50 L 150 150 L 140 150"/>
      </svg>
    </div>

    <div class="splash-content">
      <h1 class="splash-headline">Smart MUET Guide</h1>
      <p class="splash-tagline">Prepare for MUET Sesi 3 2026</p>
    </div>

    <div class="splash-progress" aria-hidden="true">
      <div class="progress-dot active"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>

    <button class="splash-skip" id="splashSkipBtn">Skip</button>
  </div>

  <script>
    const splashContainer = document.getElementById('splashContainer');
    const splashLogo = document.getElementById('splashLogo');
    const splashSkipBtn = document.getElementById('splashSkipBtn');

    const APP_ENTRY = 'muet-hub.html';
    const AUTO_ADVANCE_TIME = 2800;
    let advancing = false;

    setTimeout(() => splashLogo.classList.add('pulse'), 1200);

    function advanceToApp() {
      if (advancing) return;
      advancing = true;
      splashContainer.classList.add('exit');
      setTimeout(() => window.location.replace(APP_ENTRY), 300);
    }

    const splashTimer = setTimeout(advanceToApp, AUTO_ADVANCE_TIME);

    splashSkipBtn.addEventListener('click', () => {
      clearTimeout(splashTimer);
      advanceToApp();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        clearTimeout(splashTimer);
        advanceToApp();
      }
    }, { once:true });

    // Intentionally no global touchstart handler.
  </script>
</body>
</html>
