<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18C7B5">
  <meta name="description" content="Smart MUET Guide — Your Journey to Exam Ready">
  <title>Smart MUET Guide</title>

  <!-- Existing Smart MUET typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#101014;
      --paper:#FFFAF2;
      --teal:#18C7B5;
      --yellow:#FFD23F;
      --pink:#F56AB4;
      --blue:#215CF5;

      --line:3px solid var(--ink);
      --shadow:6px 6px 0 var(--ink);

      --font-heading:"Sora",sans-serif;
      --font-body:"DM Sans",sans-serif;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body{
      font-family:var(--font-body);
      background:var(--teal);
      color:var(--ink);
      overflow:hidden;
    }

    .splash{
      width:100%;
      max-width:480px;
      min-height:100vh;
      min-height:100dvh;
      margin:0 auto;
      padding:
        max(18px,env(safe-area-inset-top))
        max(18px,env(safe-area-inset-right))
        max(18px,env(safe-area-inset-bottom))
        max(18px,env(safe-area-inset-left));

      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }

    /* Decorative Neo-Brutalist shapes */
    .shape{
      position:absolute;
      border:var(--line);
      box-shadow:var(--shadow);
      pointer-events:none;
      z-index:0;
    }

    .shape-pink{
      width:118px;
      height:118px;
      border-radius:50%;
      background:var(--pink);
      right:-34px;
      top:8%;
      transform:rotate(8deg);
    }

    .shape-blue{
      width:92px;
      height:92px;
      background:var(--blue);
      left:-46px;
      bottom:11%;
      transform:rotate(14deg);
    }

    .splash-card{
      width:100%;
      position:relative;
      z-index:2;

      background:var(--paper);
      border:var(--line);
      border-radius:28px;
      box-shadow:9px 9px 0 var(--ink);

      padding:30px 24px 26px;
      text-align:center;

      opacity:0;
      transform:translateY(18px) scale(.98);
      animation:cardIn .65s cubic-bezier(.2,.8,.2,1) .18s forwards;
    }

    .logo-box{
      width:132px;
      height:132px;
      margin:0 auto 20px;

      background:white;
      border:var(--line);
      border-radius:26px;
      box-shadow:5px 5px 0 var(--yellow);

      display:grid;
      place-items:center;
      overflow:hidden;

      opacity:0;
      transform:scale(.85) rotate(-3deg);
      animation:logoIn .7s cubic-bezier(.2,.8,.2,1) .55s forwards;
    }

    .logo-box img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .brand{
      opacity:0;
      transform:translateY(10px);
      animation:textIn .55s ease 1.15s forwards;
    }

    .brand-kicker{
      display:inline-block;
      margin-bottom:11px;

      background:var(--ink);
      color:white;
      border:2px solid var(--ink);
      border-radius:999px;

      padding:6px 10px;

      font-size:10px;
      font-weight:1000;
      letter-spacing:.10em;
      text-transform:uppercase;
    }

    h1{
      font-family:var(--font-heading);
      font-size:clamp(32px,9vw,45px);
      line-height:.96;
      letter-spacing:-.055em;
      font-weight:800;
    }

    .tagline{
      display:inline-block;
      margin-top:13px;

      background:var(--yellow);
      border:var(--line);
      border-radius:11px;
      box-shadow:3px 3px 0 var(--ink);

      padding:8px 11px;

      font-family:var(--font-heading);
      font-size:14px;
      font-weight:800;
      transform:rotate(-1deg);
    }

    .subline{
      margin:17px auto 0;
      max-width:330px;

      font-size:12px;
      font-weight:800;
      line-height:1.5;
      color:#4B4D54;

      opacity:0;
      animation:textIn .5s ease 1.65s forwards;
    }

    .loading{
      margin-top:22px;

      display:flex;
      justify-content:center;
      gap:8px;

      opacity:0;
      animation:textIn .4s ease 2s forwards;
    }

    .dot{
      width:9px;
      height:9px;

      background:var(--ink);
      border:2px solid var(--ink);
      border-radius:50%;

      animation:dotPulse 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2){
      background:var(--yellow);
      animation-delay:.15s;
    }

    .dot:nth-child(3){
      background:var(--pink);
      animation-delay:.30s;
    }

    .skip-btn{
      position:absolute;
      top:max(18px,env(safe-area-inset-top));
      right:max(18px,env(safe-area-inset-right));
      z-index:5;

      border:var(--line);
      border-radius:999px;
      background:white;
      color:var(--ink);
      box-shadow:3px 3px 0 var(--ink);

      padding:8px 12px;

      font-family:var(--font-body);
      font-size:11px;
      font-weight:1000;

      cursor:pointer;

      opacity:0;
      pointer-events:none;
      transition:
        transform .12s ease,
        box-shadow .12s ease,
        opacity .25s ease;
    }

    .skip-btn.show{
      opacity:1;
      pointer-events:auto;
    }

    .skip-btn:active{
      transform:translate(2px,2px);
      box-shadow:1px 1px 0 var(--ink);
    }

    .splash.exit{
      animation:splashOut .35s ease forwards;
    }

    @keyframes cardIn{
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    @keyframes logoIn{
      to{
        opacity:1;
        transform:scale(1) rotate(0);
      }
    }

    @keyframes textIn{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes dotPulse{
      0%,100%{
        transform:translateY(0);
        opacity:.5;
      }
      50%{
        transform:translateY(-5px);
        opacity:1;
      }
    }

    @keyframes splashOut{
      to{
        opacity:0;
        transform:scale(.985);
      }
    }

    @media (max-width:360px){
      .splash-card{
        padding:26px 19px 22px;
      }

      .logo-box{
        width:112px;
        height:112px;
      }

      h1{
        font-size:34px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="splash" id="splash">

    <div class="shape shape-pink"></div>
    <div class="shape shape-blue"></div>

    <button
      class="skip-btn"
      id="skipBtn"
      type="button"
      aria-label="Skip splash screen"
    >
      Skip →
    </button>

    <section class="splash-card" aria-label="Smart MUET Guide splash screen">

      <!-- Real Smart MUET logo from your assets folder -->
      <div class="logo-box">
        <img
          src="assets/heroes/smart-muet-logo.svg"
          alt="Smart MUET Guide"
        >
      </div>

      <div class="brand">
        <div class="brand-kicker">SMART MUET GUIDE</div>

        <h1>
          Your Journey to
          <br>
          Exam Ready.
        </h1>

        <div class="tagline">
          Prepare with Purpose.
        </div>
      </div>

      <p class="subline">
        A smarter, more focused journey towards your MUET exam.
      </p>

      <div class="loading" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

    </section>
  </main>

  <script>
    /*
      SMART MUET SPLASH
      -----------------
      Duration: 6 seconds
      Flow: code.html / splash.html → welcome.html
      Skip button appears after 2 seconds.
      No tap-anywhere skip.
    */

    const SPLASH_DURATION = 6000;
    const SKIP_SHOW_DELAY = 2000;
    const NEXT_PAGE = 'welcome.html';

    const splash = document.getElementById('splash');
    const skipBtn = document.getElementById('skipBtn');

    let leaving = false;

    function goToWelcome() {
      if (leaving) return;
      leaving = true;

      splash.classList.add('exit');

      setTimeout(() => {
        window.location.replace(NEXT_PAGE);
      }, 350);
    }

    /* Show Skip after student has seen the brand moment */
    setTimeout(() => {
      skipBtn.classList.add('show');
    }, SKIP_SHOW_DELAY);

    /* Automatic transition after 6 seconds */
    const splashTimer = setTimeout(
      goToWelcome,
      SPLASH_DURATION
    );

    /* Explicit skip only */
    skipBtn.addEventListener('click', () => {
      clearTimeout(splashTimer);
      goToWelcome();
    });
  </script>
</body>
</html>
