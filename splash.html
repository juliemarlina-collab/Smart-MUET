<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00cdb7">
  <title>Smart MUET Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#101014;--paper:#fffaf2;--teal:#00cdb7;--blue:#0757ff;
      --yellow:#ffc400;--pink:#ff70b8;--lime:#b8ff36;
      --line:3px solid var(--ink);--shadow:6px 6px 0 var(--ink);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"DM Sans",sans-serif;background:var(--teal);color:var(--ink);overflow:hidden}
    .splash{
      width:100%;max-width:480px;min-height:100dvh;margin:auto;
      padding:24px 18px;display:grid;place-items:center;position:relative;
    }
    .shape{position:absolute;border:var(--line);box-shadow:var(--shadow);z-index:0}
    .shape.a{width:105px;height:105px;background:var(--pink);border-radius:50%;right:-25px;top:8%}
    .shape.b{width:90px;height:90px;background:var(--blue);left:-45px;bottom:12%;transform:rotate(12deg)}
    .card{
      width:100%;position:relative;z-index:2;background:var(--paper);
      border:var(--line);border-radius:28px;box-shadow:9px 9px 0 var(--ink);
      padding:26px 22px;text-align:left;
    }
    .logo-box{
      width:108px;height:108px;background:white;border:var(--line);border-radius:24px;
      box-shadow:4px 4px 0 var(--yellow);display:grid;place-items:center;overflow:hidden;margin-bottom:18px;
    }
    .logo-box img{width:100%;height:100%;object-fit:contain}
    .kicker{
      display:inline-block;background:var(--ink);color:white;border-radius:999px;
      padding:6px 10px;font-size:10px;font-weight:1000;letter-spacing:.1em;margin-bottom:12px;
    }
    h1{font-family:"Sora";font-size:42px;line-height:.95;letter-spacing:-.055em}
    h1 span{
      display:inline-block;margin-top:7px;background:var(--yellow);border:var(--line);
      border-radius:10px;padding:4px 8px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1deg)
    }
    .tagline{margin-top:16px;font-size:14px;font-weight:900;line-height:1.5}
    .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
    .mini{
      border:2px solid var(--ink);border-radius:13px;padding:10px 5px;text-align:center;
      font-size:9px;font-weight:1000;box-shadow:2px 2px 0 var(--ink)
    }
    .mini:nth-child(1){background:var(--pink)}.mini:nth-child(2){background:var(--lime)}.mini:nth-child(3){background:#77a3ff}
    .enter{
      display:block;margin-top:20px;width:100%;padding:15px;border:var(--line);border-radius:14px;
      background:var(--yellow);color:var(--ink);text-decoration:none;text-align:center;
      font-weight:1000;box-shadow:var(--shadow)
    }
    .skip{display:block;text-align:center;margin-top:12px;color:var(--ink);font-size:11px;font-weight:900;text-decoration:none}
    .fade{animation:out .25s ease forwards}
    @keyframes out{to{opacity:0;transform:scale(.985)}}
    @media(max-width:360px){h1{font-size:36px}.card{padding:22px 18px}}
  </style>
</head>
<body>
  <main class="splash" id="splash">
    <div class="shape a"></div><div class="shape b"></div>
    <section class="card">
      <div class="logo-box">
        <img src="assets/heroes/smart-muet-logo.svg" alt="Smart MUET Guide logo">
      </div>
      <div class="kicker">SMART MUET GUIDE · PHASE 1</div>
      <h1>Your journey to<br><span>EXAM READY.</span></h1>
      <p class="tagline">Prepare with purpose. Track your progress. Know what to do next — right up to MUET exam day.</p>
      <div class="mini-grid">
        <div class="mini">⏱️<br>COUNTDOWN</div>
        <div class="mini">🎯<br>READINESS</div>
        <div class="mini">📚<br>PRACTICE</div>
      </div>
      <a href="muet-hub.html" class="enter" id="enterBtn">START MY MUET JOURNEY →</a>
      <a href="muet-hub.html" class="skip">Already started? Welcome back →</a>
    </section>
  </main>
  <script>
    // Keep splash visible long enough to be seen; do not skip on touch.
    const splash = document.getElementById('splash');
    const go = () => {
      splash.classList.add('fade');
      setTimeout(() => location.replace('muet-hub.html'), 250);
    };
    const timer = setTimeout(go, 3200);
    document.getElementById('enterBtn').addEventListener('click', e => {
      e.preventDefault(); clearTimeout(timer); go();
    });
  </script>
</body>
</html>
